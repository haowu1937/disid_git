model:
  type: disentangle
  variant: shared_vocab

  input_dim: 2048
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  num_shared_layers: 1

  commitment_weight: 0.25
  codebook_weight: 1
  normalize_codebook_loss: true
  domain_embed_init: mean

data:
  domain_configs:
    - name: QB
      embed_path: /mnt/data_2/data_hao/DisenID/data/QB/Qwen3VL_emb/shard_00000_fused.npy
      id_map_path: /mnt/data_2/data_hao/DisenID/data/QB/Qwen3VL_emb/shard_00000_ids_incremental.npy

    - name: TN
      embed_path: /mnt/data_2/data_hao/DisenID/data/TN/Qwen3VL_emb/shard_00000_fused.npy
      id_map_path: /mnt/data_2/data_hao/DisenID/data/TN/Qwen3VL_emb/shard_00000_ids_incremental.npy

    - name: Bili #Bili500k
      embed_path: /mnt/data_2/data_hao/DisenID/data/Bili_500K/Qwen3VL_emb/shard_00000_fused.npy
      id_map_path: /mnt/data_2/data_hao/DisenID/data/Bili_500K/Qwen3VL_emb/shard_00000_ids_incremental.npy

  expected_embed_dim: 2048
  num_domains: 3   # explicit, will be used by HierarchicalRQVAE

# -----------------------
# NEW: semantic id generation
# -----------------------
generation:

  # checkpoint to load
  ckpt_path: /mnt/data_2/data_hao/DisenID/sid_checkpoints/ninerec/qwen_dsrqvae_sv_bili500k_TN_QB/final.pt

  # where semantic ids will be written
  out_dir: /home/hao/FRec/DisenID/codebook/qwen_dsrqvae_sv_bili500k_TN_QB

  # optional overrides (otherwise fallback to training section)
  batch_size: 512
  num_workers: 4
  pin_memory: true