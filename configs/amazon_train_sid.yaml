# configs/train_sid_ninerec.yaml
model:
  type: baseline
  input_dim: 768
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  commitment_weight: 0.25
  codebook_weight: 1
  normalize_codebook_loss: true

data:
  domain_configs:
    - name: beauty
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/beauty/embedding.npy
      # id_map_path is optional, omitted here
  expected_embed_dim: 768
  num_domains: 1   # explicit, will be used by HierarchicalRQVAE

training:
  seed: 42
  batch_size: 1024
  num_workers: 0
  pin_memory: true
  codebook_init: kmeans
  codebook_init_max_batches: 10 # set to null for entire epoch
  lr: 0.00005
  weight_decay: 0.0
  num_epochs: 200
  save_dir: /mnt/data_2/data_hao/DisenID/sid_checkpoints/beauty
  save_every: 10
  grad_clip: 1.0


