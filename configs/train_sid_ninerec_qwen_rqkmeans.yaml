# configs/train_sid_ninerec_qwen_rqkmeans.yaml

model:
  type: rqkmeans
  input_dim: 2048
  codebook_size: 256
  num_layers: 3
  keep_empty_codes: true

data:
  domain_configs:
    - name: QB
      embed_path: /mnt/data_2/data_hao/DisenID/data/QB/Qwen3VL_emb/shard_00000_fused.npy
    - name: TN
      embed_path: /mnt/data_2/data_hao/DisenID/data/TN/Qwen3VL_emb/shard_00000_fused.npy
    - name: Bili # Bili500k
      embed_path: /mnt/data_2/data_hao/DisenID/data/Bili_500K/Qwen3VL_emb/shard_00000_fused.npy

  expected_embed_dim: 2048
  num_domains: 3

training:
  seed: 42
  batch_size: 256
  num_workers: 0
  pin_memory: true

  # RQ-KMeans does not use gradient training.
  # It uses assignment-update iterations instead of epochs.
  num_iters: 20

  # Initialize residual codebooks with sklearn KMeans.
  # 100 batches * 256 = 25,600 samples for initialization.
  codebook_init: kmeans
  codebook_init_max_batches: 100

  save_dir: /mnt/data_2/data_hao/DisenID/sid_checkpoints/ninerec/qwen_bili500k_TN_QB_rqkmeans