# configs/baseline_generate.yaml
model:
  type: baseline
  input_dim: 768
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  commitment_weight: 0.25
  codebook_weight: 1
  normalize_codebook_loss: true


data:
  domain_configs:
    - name: beauty
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/beauty/embedding.npy
      id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/beauty/ids.npy

  expected_embed_dim: 768
  num_domains: 2


training:
  seed: 42
  batch_size: 256
  num_workers: 0
  pin_memory: true
  lr: 0.001
  weight_decay: 0.0
  num_epochs: 200
  save_dir: /mnt/data_2/data_hao/DisenID/sid_checkpoints/beauty/
  save_every: 10
  grad_clip: 1.0


# -----------------------
# NEW: semantic id generation
# -----------------------
generation:

  # checkpoint to load
  ckpt_path: /mnt/data_2/data_hao/DisenID/sid_checkpoints/beauty/final.pt

  # where semantic ids will be written
  out_dir: /home/hao/FRec/DisenID/codebooks/beauty

  # optional overrides (otherwise fallback to training section)
  batch_size: 512
  num_workers: 4
  pin_memory: true