generation:

  # checkpoint to load
  ckpt_path: /mnt/data_2/data_hao/DisenID/sid_checkpoints/ninerec/domain_sampling_dt/epoch_080.pt

  # where semantic ids will be written
  out_dir: /home/hao/FRec/DisenID/codebook/domain_sampling_dt

  # optional overrides (otherwise fallback to training section)
  batch_size: 512
  num_workers: 4
  pin_memory: true