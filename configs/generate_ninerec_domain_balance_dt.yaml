model:
  type: disentangle #baseline
  input_dim: 768
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  num_shared_layers: 1
  commitment_weight: 0.25
  codebook_weight: 1
  normalize_codebook_loss: true
  domain_embed_init: mean
# python -m src.generation.generate_semantic_ids --config ./configs/generate_ninerec_domain_balance_dt.yaml

data:
  domain_configs:
    - name: QB
      embed_path: /mnt/data_2/data_oleg/recsys/ninerec/Downstream_datasets/QB/CLIP_emb/shard_00000_fused.npy
      id_map_path: /mnt/data_2/data_oleg/recsys/ninerec/Downstream_datasets/QB/CLIP_emb/shard_00000_ids_incremental.npy

    - name: TN
      embed_path: /mnt/data_2/data_oleg/recsys/ninerec/Downstream_datasets/TN/CLIP_emb/shard_00000_fused.npy
      id_map_path: /mnt/data_2/data_oleg/recsys/ninerec/Downstream_datasets/TN/CLIP_emb/shard_00000_ids_incremental.npy

    - name: Bili #Bili10k
      embed_path: /mnt/data_2/data_hao/DisenID/data/Bili_10k/CLIP_emb/shard_00000_fused.npy
      id_map_path: /mnt/data_2/data_hao/DisenID/data/Bili_10k/CLIP_emb/shard_00000_ids_incremental.npy

  expected_embed_dim: 768
  num_domains: 3


# -----------------------
