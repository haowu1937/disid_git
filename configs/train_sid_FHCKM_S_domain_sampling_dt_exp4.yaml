# CUDA_VISIBLE_DEVICES=2 nohup python -m src.training.train_rqvae --config ./configs/train_sid_FHCKM_S_domain_sampling_dt_exp4.yaml > ./logs/train_sid_FHCKM_S_domain_sampling_dt_exp4.txt 2>&1 &
model:
  type: disentangle #baseline
  input_dim: 768
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  num_shared_layers: 1
  commitment_weight: 0.25
#  encoder_hidden_dims: [512, 256]
#  decoder_hidden_dim: [256, 512]
  codebook_weight: 1
  normalize_codebook_loss: true
  domain_embed_init: mean
  alpha: 0.015


data:
  domain_configs:
    - name: FHCKM
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/shard_00000_ids_incremental.npy
    - name: Scientific
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/downstream/Scientific/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/downstream/Scientific/shard_00000_ids_incremental.npy

  expected_embed_dim: 768
  num_domains: 2

training:
  seed: 45 #42
  batch_size: 4096
  num_workers: 0
  pin_memory: true
  lr: 0.0012 # 0.0012
  weight_decay: 0.0
  num_epochs: 200
  save_dir: /mnt/data_2/data_hao/DisenID/sid_checkpoints/FHKCKM_S_dt_ds_exp4
  save_every: 10
  grad_clip: 1.0
  codebook_init: random
  codebook_init_max_batches: 200
  metrics_every: 1
  metrics_max_batches: 200
  domain_balance:
    enabled: true
    mode: temperature     # uniform | temperature
    rho: 0.4
    tau: 0.4
    replacement: true
    drop_last: false