model:
  type: disentangle #baseline
  input_dim: 768
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  num_shared_layers: 1
  commitment_weight: 0.25
  codebook_weight: 1
  normalize_codebook_loss: true
  domain_embed_init: mean
# python -m src.training.train_rqvae --config ./configs/train_sid_ninerec_domain_sampling_dt.yaml
data:
  domain_configs:
    - name: QB
      embed_path: /mnt/data_2/data_oleg/recsys/ninerec/Downstream_datasets/QB/CLIP_emb/shard_00000_fused.npy
    - name: TN
      embed_path: /mnt/data_2/data_oleg/recsys/ninerec/Downstream_datasets/TN/CLIP_emb/shard_00000_fused.npy
    - name: Bili
      embed_path: /mnt/data_2/data_hao/DisenID/data/Bili_10k/CLIP_emb/shard_00000_fused.npy
  expected_embed_dim: 768
  num_domains: 3

training:
  seed: 42
  batch_size: 256
  num_workers: 0
  pin_memory: true
  lr: 0.0004
  weight_decay: 0.0
  num_epochs: 200
  save_dir: /mnt/data_2/data_hao/DisenID/sid_checkpoints/ninerec/domain_sampling_dt
  save_every: 10
  grad_clip: 1.0
  codebook_init: random
  codebook_init_max_batches: 200
  metrics_every: 1
  metrics_max_batches: 200
  domain_balance:
    enabled: true
    mode: temperature     # uniform | temperature
    rho: 0.4
    tau: 0.5
    replacement: true
    drop_last: false