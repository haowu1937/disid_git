# configs/train_sid_ninerec.yaml
model:
  type: baseline
  input_dim: 768
  hidden_dim: 128
  codebook_size: 256
  num_layers: 3
  commitment_weight: 0.25
  codebook_weight: 1
  normalize_codebook_loss: true

data:
  domain_configs:
    - name: Food
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Food/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Food/shard_00000_ids_incremental.npy
    - name: Home
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Home/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Home/shard_00000_ids_incremental.npy
    - name: CDs
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/CDs/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/CDs/shard_00000_ids_incremental.npy
    - name: Kindle
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Kindle/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Kindle/shard_00000_ids_incremental.npy
    - name: Movies
      embed_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Movies/shard_00000_fused.npy
      # id_map_path: /mnt/data_2/data_hao/DisenID/data/Amazon/FHCKM/Movies/shard_00000_ids_incremental.npy

  expected_embed_dim: 768
  num_domains: 5

training:
  seed: 42
  batch_size: 4096
  num_workers: 0
  pin_memory: true
  lr: 0.001
  weight_decay: 0.0
  num_epochs: 200
  save_dir: /mnt/data_2/data_hao/DisenID/sid_checkpoints/FHKCKM/
  save_every: 10
  grad_clip: 1.0


